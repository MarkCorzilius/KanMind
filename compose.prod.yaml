services:
  web:
    image: 254771353313.dkr.ecr.eu-central-1.amazonaws.com/kanmind-backend:latest
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env.prod
    volumes:
      - ./staticfiles:/app/staticfiles
    restart: unless-stopped
